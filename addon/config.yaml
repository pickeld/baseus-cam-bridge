name: Baseus Cam Bridge
version: "0.1.2"
slug: baseus_cam_bridge
description: Local RTSP/HLS/WebRTC gateway for Baseus Security cameras
url: https://github.com/pickeld/baseus-cam-bridge/tree/main/addon
arch:
  - aarch64
  - amd64
  - armv7
init: false
host_network: true
boot: auto
startup: application
ports:
  8554/tcp: 8554
  8888/tcp: 8888
  8889/tcp: 8889
  8189/udp: 8189
ports_description:
  8554/tcp: RTSP (open in VLC / add as HA camera)
  8888/tcp: HLS
  8889/tcp: WebRTC
  8189/udp: WebRTC ICE
options:
  account: ""
  password: ""
  region: AUTO
  country_code: "1"
  include_offline: true
  framerate: 25
schema:
  account: str
  password: password
  region: list(AUTO|US|EU|AU)
  country_code: str
  include_offline: bool
  framerate: int(1,60)
